<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c0392b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Aplikasi Kanji MrDJ</title>
    <style>
      :root {
        --bg: #faf8f5;
        --card: #fff;
        --tx: #1f1d1a;
        --mut: #7a746b;
        --bd: #e6e0d6;
        --ac: #c0392b;
        --chip: #f3ece1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171614;
          --card: #222120;
          --tx: #f0ece6;
          --mut: #a39c91;
          --bd: #37352f;
          --ac: #ef6c5d;
          --chip: #2e2c28;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Noto Sans JP',
          'Hiragino Sans',
          sans-serif;
        line-height: 1.5;
        touch-action: manipulation;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .hd {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
      }
      .hd-in,
      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .cnt {
        color: var(--mut);
        font-size: 12px;
      }
      #q {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border: 1px solid var(--bd);
        border-radius: 12px;
        background: var(--card);
        color: var(--tx);
        font-size: 16px; /* 16px mencegah zoom otomatis di iOS */
        -webkit-appearance: none;
        appearance: none;
      }
      .chips {
        display: flex;
        overflow-x: auto;
        padding: 8px 0 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: none;
        min-height: 40px;
        margin-right: 8px;
        padding: 0 16px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        background: var(--card);
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .wrap {
        padding: 16px max(12px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 8px;
      }
      .tile {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 8px 2px;
        text-align: center;
        min-height: 76px;
        overflow: hidden;
      }
      .tile:active {
        border-color: var(--ac);
      }
      .tile b {
        display: block;
        font-size: 32px;
        font-weight: 500;
        line-height: 1.2;
      }
      .tile span {
        display: block;
        font-size: 11px;
        color: var(--mut);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 4px;
      }
      .more {
        display: block;
        width: 100%;
        margin-top: 14px;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid var(--bd);
        background: var(--card);
      }
      .empty {
        color: var(--mut);
        font-size: 14px;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .nav button {
        background: none;
        border: 0;
        color: var(--ac);
        min-height: 44px;
        min-width: 44px;
        padding: 0 8px;
      }
      .nav .arr {
        font-size: 26px;
        line-height: 1;
      }
      .hero {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 16px;
        text-align: center;
      }
      .sw {
        width: 220px;
        max-width: 100%;
        margin: 0 auto 10px;
        border: 1px solid var(--bd);
        border-radius: 16px;
        background: var(--bg);
        aspect-ratio: 1 / 1;
        position: relative;
      }
      .sw svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sw .msg {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
        color: var(--mut);
        font-size: 13px;
      }
      .an.cur {
        stroke: var(--ac);
      }
      .pl {
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 99px;
        padding: 0 22px;
        min-height: 44px;
      }
      .sc {
        color: var(--mut);
        font-size: 13px;
        margin: 8px 0 0;
      }
      .tag {
        display: inline-block;
        background: var(--chip);
        border-radius: 99px;
        padding: 3px 10px;
        margin: 0 3px;
        font-size: 12px;
      }
      h3 {
        font-size: 16px;
        margin: 22px 0 8px;
      }
      .word {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 8px;
      }
      .word .jp {
        font-size: 20px;
        word-break: keep-all;
      }
      .word .jp button {
        font-size: inherit;
        background: none;
        border: 0;
        padding: 0;
        text-decoration: underline dotted var(--mut);
        text-underline-offset: 4px;
      }
      .word .jp .me {
        color: var(--ac);
        font-weight: 600;
      }
      .word .rd {
        color: var(--mut);
        font-size: 14px;
        margin-left: 6px;
      }
      .word p {
        margin: 2px 0 0;
        font-size: 14px;
        color: var(--mut);
      }
      .ft {
        color: var(--mut);
        font-size: 11px;
        margin-top: 28px;
        text-align: center;
      }
    </style>
  </head>
  <body oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;">
    <header class="hd" id="hd">
      <div class="hd-in">
        <div class="top">
          <h1>Mr.DJ 漢字マスター</h1>
          <span class="cnt" id="cnt"></span>
        </div>
        <input id="q" type="search" placeholder="Cari kanji, jukugo, bacaan, atau arti…" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <div class="chips" id="chips"></div>
      </div>
    </header>
    <main class="wrap" id="main"></main>
    <script src="data/data.js"></script>
    <script src="data/prot.js"></script>
    <script>
      // ---------- Level ----------
      // data.js tidak menyimpan level, jadi level ditentukan dari urutan kanji di data.js:
      // kanji di bawah adalah kanji PERTAMA tiap blok level (blok N5 dimulai dari awal file).
      // Untuk menambah N2: sisipkan kanji-kanjinya di data.js lalu tulis kanji pertamanya di sini, mis. { 勉: 'N4', 申: 'N3', 泳: 'N2', 炊: 'N1' }.
      var LV_START = { 勉: 'N4', 申: 'N3', 泳: 'N2', 炊: 'N1' };
      var ORDER = ['N5', 'N4', 'N3', 'N2', 'N1'];
      var VG = ['https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/', 'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/'];

      // ---------- Kana ----------
      var HG = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ';
      var RO = 'a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po'.split(' ');
      function toK(s) {
        return s.replace(/[\u3041-\u3096]/g, function (c) {
          return String.fromCharCode(c.charCodeAt(0) + 96);
        });
      }
      var KANA = {};
      HG.split('').forEach(function (c, i) {
        KANA[c] = KANA[toK(c)] = RO[i];
      });

      // ---------- Data dari data.js ----------
      var BY = { hiragana: HG.split(''), katakana: toK(HG).split('') },
        LV = {},
        ALL = [].concat(BY.hiragana, BY.katakana),
        H = {};
      (function () {
        var lv = 'N5';
        Object.keys(JUKUGO).forEach(function (k) {
          if (Array.from(k).length !== 1) return; // lewati entri kata (bukan 1 kanji)
          lv = LV_START[k] || lv;
          LV[k] = lv;
          (BY[lv] = BY[lv] || []).push(k);
          ALL.push(k);
        });
      })();
      var CATS = [
        ['hiragana', 'あ'],
        ['katakana', 'ア'],
      ].concat(
        ORDER.filter(function (l) {
          return BY[l];
        }).map(function (l) {
          return [l, l];
        }),
      );

      // ---------- State ----------
      var cat = BY.N5 ? 'N5' : 'hiragana',
        q = '',
        lim = 120,
        cur = null,
        curList = [],
        sy = 0,
        tm = [],
        SC = {};
      var hd = document.getElementById('hd'),
        main = document.getElementById('main'),
        qi = document.getElementById('q'),
        cnt = document.getElementById('cnt');

      function e(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      function words(k) {
        return JUKUGO[k] || [];
      }
      function hay(k) {
        return (
          H[k] ||
          (H[k] = (
            k +
            ' ' +
            (KANA[k] || '') +
            ' ' +
            words(k)
              .map(function (w) {
                return w.join(' ');
              })
              .join(' ')
          ).toLowerCase())
        );
      }
      function tile(k) {
        var w = words(k)[0];
        return '<button class="tile" data-k="' + k + '"><b>' + k + '</b><span>' + e(KANA[k] || (w && w[1]) || '') + '</span></button>';
      }
      function chips() {
        document.getElementById('chips').innerHTML = CATS.map(function (c) {
          return '<button class="chip' + (c[0] === cat && !q.trim() ? ' on' : '') + '" data-cat="' + c[0] + '">' + c[1] + '</button>';
        }).join('');
      }
      function stop() {
        tm.forEach(clearTimeout);
        tm = [];
      }

      // ---------- Daftar ----------
      function showList() {
        cur = null;
        stop();
        hd.style.display = '';
        var t = q.trim().toLowerCase();
        curList = t
          ? ALL.filter(function (k) {
              return hay(k).indexOf(t) > -1;
            })
          : BY[cat] || [];
        main.innerHTML = curList.length
          ? '<div class="grid">' + curList.slice(0, lim).map(tile).join('') + '</div>' + (curList.length > lim ? '<button class="more" data-more="1">Tampilkan lebih banyak (' + (curList.length - lim) + ')</button>' : '')
          : '<p class="empty">Tidak ada hasil.</p>';
        main.innerHTML += '<p class="ft">Animasi goresan: KanjiVG (CC BY-SA 3.0)</p>';
        cnt.textContent = curList.length + ' karakter';
      }

      // ---------- Detail: animasi goresan + jukugo ----------
      function wordHtml(w, k) {
        var t = Array.from(w[0])
          .map(function (c) {
            return c === k ? '<span class="me">' + c + '</span>' : JUKUGO[c] ? '<button data-k="' + c + '">' + c + '</button>' : '<span>' + c + '</span>';
          })
          .join('');
        return '<div class="word"><span class="jp">' + t + '</span><span class="rd">【' + e(w[1]) + '】</span><p>' + e(w[2]) + '</p></div>';
      }
      function showDetail(k) {
        cur = k;
        hd.style.display = 'none';
        var i = curList.indexOf(k),
          n = curList.length,
          ws = words(k);
        var h = '<div class="nav"><button data-back="1">← Kembali</button>';
        if (i > -1 && n > 1)
          h += '<div><button class="arr" aria-label="Sebelumnya" data-nav="' + curList[(i - 1 + n) % n] + '">‹</button><button class="arr" aria-label="Selanjutnya" data-nav="' + curList[(i + 1) % n] + '">›</button></div>';
        h += '</div><div class="hero"><div class="sw" id="sv"><div class="msg">Memuat animasi…</div></div><button class="pl" id="pl" hidden>▶ Ulangi animasi</button><p class="sc" id="sc"></p><div style="margin-top:8px">';
        h += '<span class="tag">' + e(LV[k] || (KANA[k] ? (/[\u3041-\u3096]/.test(k) ? 'Hiragana' : 'Katakana') + ' · ' + KANA[k] : '')) + '</span></div></div>';
        if (ws.length)
          h +=
            '<h3>Jukugo (' +
            ws.length +
            ')</h3>' +
            ws
              .map(function (w) {
                return wordHtml(w, k);
              })
              .join('');
        main.innerHTML = h + '<p class="ft">Animasi goresan: KanjiVG (CC BY-SA 3.0)</p>';
        window.scrollTo(0, 0);
        initStroke(k);
      }

      function getStrokes(k) {
        if (SC[k]) return Promise.resolve(SC[k]);
        var f = k.codePointAt(0).toString(16);
        while (f.length < 5) f = '0' + f;
        function tryAt(i) {
          if (i >= VG.length) return Promise.resolve(null);
          return fetch(VG[i] + f + '.svg')
            .then(function (r) {
              if (!r.ok) throw 0;
              return r.text();
            })
            .then(function (t) {
              var p = [].map.call(new DOMParser().parseFromString(t, 'image/svg+xml').querySelectorAll('path'), function (n) {
                return n.getAttribute('d');
              });
              if (!p.length) throw 0;
              return (SC[k] = p);
            })
            .catch(function () {
              return tryAt(i + 1);
            });
        }
        return tryAt(0);
      }

      function initStroke(k) {
        getStrokes(k).then(function (P) {
          var box = document.getElementById('sv');
          if (cur !== k || !box) return;
          if (!P) {
            box.innerHTML = '<div class="msg">Animasi tidak dapat dimuat. Periksa koneksi internet.</div>';
            return;
          }
          box.innerHTML =
            '<svg viewBox="0 0 109 109" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M54.5,4 V105 M4,54.5 H105" stroke="var(--bd)" stroke-width="0.5" stroke-dasharray="3 4"/>' +
            P.map(function (d) {
              return '<path d="' + d + '" stroke="var(--bd)"/>';
            }).join('') +
            P.map(function (d) {
              return '<path class="an" d="' + d + '" stroke="var(--tx)"/>';
            }).join('') +
            '</svg>';
          var ps = [].slice.call(box.querySelectorAll('.an')),
            sc = document.getElementById('sc'),
            pl = document.getElementById('pl');
          pl.hidden = false;
          function play() {
            stop();
            ps.forEach(function (p) {
              var L = p.getTotalLength();
              p.classList.remove('cur');
              p.style.transition = 'none';
              p.style.strokeDasharray = L;
              p.style.strokeDashoffset = L;
            });
            var t = 150;
            ps.forEach(function (p, i) {
              var dur = 300 + p.getTotalLength() * 7;
              tm.push(
                setTimeout(function () {
                  if (i) ps[i - 1].classList.remove('cur');
                  p.getBoundingClientRect(); // paksa reflow agar transisi berjalan
                  p.classList.add('cur');
                  p.style.transition = 'stroke-dashoffset ' + dur + 'ms linear';
                  p.style.strokeDashoffset = 0;
                  sc.textContent = 'Goresan ' + (i + 1) + ' dari ' + ps.length;
                }, t),
              );
              t += dur + 150;
            });
            tm.push(
              setTimeout(function () {
                ps[ps.length - 1].classList.remove('cur');
                sc.textContent = ps.length + ' goresan';
              }, t + 100),
            );
          }
          pl.onclick = play;
          play();
        });
      }

      // ---------- Interaksi & riwayat (tombol Kembali di ponsel) ----------
      qi.addEventListener('input', function () {
        q = qi.value;
        lim = 120;
        chips();
        showList();
      });
      document.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-k],[data-cat],[data-back],[data-nav],[data-more]');
        if (!b) return;
        var d = b.dataset;
        if (d.cat) {
          cat = d.cat;
          q = qi.value = '';
          lim = 120;
          chips();
          showList();
          window.scrollTo(0, 0);
        } else if (d.k) {
          if (cur === null) sy = window.pageYOffset;
          history.pushState({ d: d.k }, '');
          showDetail(d.k);
        } else if (d.nav) {
          history.replaceState({ d: d.nav }, '');
          showDetail(d.nav);
        } else if (d.back) {
          if (history.state && history.state.d) history.back();
          else showList();
        } else if (d.more) {
          lim += 120;
          showList();
        }
      });
      window.addEventListener('popstate', function (ev) {
        if (ev.state && ev.state.d) showDetail(ev.state.d);
        else {
          showList();
          window.scrollTo(0, sy);
        }
      });
      chips();
      showList();
    </script>
  </body>
</html>
